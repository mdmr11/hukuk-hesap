<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hukuk Hesap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1c1c1e);
    --ipucu: var(--tg-theme-hint-color, #8e8e93);
    --alan: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --vurgu: var(--tg-theme-button-color, #2481cc);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --hata: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --bg: #1c1c1e; --fg: #f2f2f7; --alan: #2c2c2e; --ipucu: #98989f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 96px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .alan { margin: 0 0 14px; }
  .alan[hidden] { display: none; }
  label { display: block; font-size: 13px; color: var(--ipucu); margin: 0 0 6px; }
  input, select {
    width: 100%; font: inherit; color: var(--fg); background: var(--alan);
    border: 1px solid transparent; border-radius: 10px; padding: 12px; min-height: 46px;
    -webkit-appearance: none; appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--ipucu) 50%),
           linear-gradient(135deg, var(--ipucu) 50%, transparent 50%);
           background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
           background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; }
  input:focus, select:focus { outline: none; border-color: var(--vurgu); }
  .hatali input, .hatali select { border-color: var(--hata); }
  .not { font-size: 12px; color: var(--ipucu); margin-top: 4px; }
  .hata-yazi { font-size: 13px; color: var(--hata); margin-top: 4px; }
  #gonder {
    width: 100%; border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 600;
    background: var(--vurgu); color: var(--vurgu-yazi); margin-top: 8px;
  }
  .tarih-kutu { display: flex; gap: 8px; }
  .tarih-kutu input[type=text] { flex: 1 1 auto; min-width: 0; }
  .takvim { position: relative; flex: 0 0 46px; min-height: 46px; border-radius: 10px;
            background: var(--alan); display: flex; align-items: center; justify-content: center;
            font-size: 20px; }
  .takvim input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%;
                             min-height: 0; padding: 0; opacity: 0; }
  #onizleme { white-space: pre-wrap; word-break: break-all; font-size: 12px;
              background: var(--alan); padding: 12px; border-radius: 10px; margin-top: 16px; }
  #onizleme:empty { display: none; }
</style>
</head>
<body>
<h1>⚖️ Hukuk Hesap</h1>

<form id="form" novalidate>
  <div class="alan" data-a="hesap">
    <label for="hesap">Hesap türü</label>
    <select id="hesap">
      <option value="dosya">📁 Dosya hesabı (alacak + faiz + vekalet + harç)</option>
      <option value="alacak">💰 Alacak faizi</option>
      <option value="vekalet">👔 Vekalet + harç + gider</option>
      <option value="harc">🏛 Harç</option>
      <option value="posta">✉️ Tebligat / posta ücreti</option>
      <option value="kira">📈 Kira artışı</option>
      <option value="kiraseyri">🗓 Kira seyri</option>
    </select>
  </div>

  <div class="alan" data-a="dosya">
    <label for="dosya">Dosya türü</label>
    <select id="dosya"><option value="icra">İcra takibi</option><option value="dava">Dava</option></select>
  </div>

  <div class="alan" data-a="tur_vek">
    <label for="tur_vek">İşin türü</label>
    <select id="tur_vek">
      <option value="dava">Dava</option><option value="tahliye">Tahliye davası</option>
      <option value="tespit">Kira tespit davası</option><option value="icra">İcra takibi</option>
      <option value="icramahkemesi">İcra mahkemesi</option>
    </select>
  </div>

  <div class="alan" data-a="tur_harc">
    <label for="tur_harc">Harç türü</label>
    <select id="tur_harc">
      <option value="dava">Dava</option><option value="icra">İcra takibi</option>
      <option value="icramahkemesi">İcra mahkemesi</option>
      <option value="tahliye">Tahliye davası</option><option value="tespit">Kira tespit davası</option>
    </select>
  </div>

  <div class="alan" data-a="tur_kira">
    <label for="tur_kira">Kira türü</label>
    <select id="tur_kira"><option value="konut">Konut</option><option value="isyeri">Çatılı işyeri</option></select>
  </div>

  <div class="alan" data-a="tur_posta">
    <label for="tur_posta">Gönderi türü</label>
    <select id="tur_posta">
      <option value="normal">Tebligat</option><option value="hizli">Hızlı tebligat</option>
      <option value="mts">MTS tebligat</option><option value="taahhutlu">Taahhütlü mektup</option>
      <option value="iadeli">İadeli taahhütlü (kart)</option>
      <option value="eposta">İadeli taahhütlü (e-posta)</option>
    </select>
  </div>

  <div class="alan" data-a="adet">
    <label for="adet">Adet</label>
    <input id="adet" type="text" inputmode="numeric" value="1" maxlength="4" autocomplete="off">
  </div>

  <div class="alan" data-a="agirlik">
    <label for="agirlik">Ağırlık (gram)</label>
    <input id="agirlik" type="text" inputmode="decimal" placeholder="Boş = ilk dilim" autocomplete="off">
    <div class="not">Boş bırakılırsa ilk dilim varsayılır: tebligatta 100 grama, mektupta 20 grama kadar.</div>
  </div>

  <div class="alan" data-a="faiz">
    <label for="faiz">Faiz türü</label>
    <select id="faiz">
      <option value="yasal">Yasal</option><option value="ticari">Ticari (yarıyıl)</option>
      <option value="avans">Avans (TCMB tarihleri)</option><option value="sozlesme">Sözleşme oranı</option>
      <option value="faizsiz">Faizsiz</option>
    </select>
  </div>

  <div class="alan" data-a="oran">
    <label for="oran">Yıllık sözleşme faiz oranı (%)</label>
    <input id="oran" type="text" inputmode="decimal" placeholder="ör. 24" autocomplete="off">
  </div>

  <div class="alan" data-a="mahkeme">
    <label for="mahkeme">Mahkeme</label>
    <select id="mahkeme">
      <option value="asliye">Asliye hukuk</option><option value="sulh">Sulh hukuk</option>
      <option value="ticaret">Asliye ticaret</option><option value="is">İş</option>
      <option value="tuketici">Tüketici</option><option value="aile">Aile</option>
    </select>
  </div>

  <div class="alan" data-a="mahkeme_harc">
    <label for="mahkeme_harc">Mahkeme</label>
    <select id="mahkeme_harc">
      <option value="asliye">Asliye (ticaret, iş, tüketici, aile dahil)</option><option value="sulh">Sulh</option>
    </select>
  </div>

  <div class="alan" data-a="icramah">
    <label for="icramah">İcra mahkemesindeki iş</label>
    <select id="icramah">
      <option value="durusmasiz">Duruşmasız (itirazın kaldırılması, şikâyet…)</option>
      <option value="durusmali">Dava / duruşmalı iş</option><option value="istihkak">İstihkak davası</option>
    </select>
  </div>

  <div class="alan" data-a="ilam">
    <label for="ilam">Takip türü</label>
    <select id="ilam"><option value="ilamsiz">İlamsız</option><option value="ilamli">İlamlı</option></select>
  </div>

  <div class="alan" data-a="tutar">
    <label for="tutar" id="tutar_etiket">Tutar (TL)</label>
    <input id="tutar" type="text" inputmode="decimal" placeholder="ör. 100.000" autocomplete="off">
  </div>

  <div class="alan" data-a="taraf">
    <label for="taraf">Taraf sayısı (davacı + davalı)</label>
    <input id="taraf" type="text" inputmode="numeric" value="2" maxlength="3" autocomplete="off">
    <div class="not">Gider avansı hesabı için; çoğu davada 2.</div>
  </div>

  <div class="alan" data-a="borclu">
    <label for="borclu">Borçlu sayısı</label>
    <input id="borclu" type="text" inputmode="numeric" value="1" maxlength="3" autocomplete="off">
    <div class="not">Yalnız ödeme emri tebligat masrafı bilgi satırı için; toplamlara girmez.</div>
  </div>

  <div class="alan" data-a="bas">
    <label for="bas" id="bas_etiket">Başlangıç tarihi</label>
    <div class="tarih-kutu">
      <input id="bas" type="text" inputmode="numeric" placeholder="GG.AA.YYYY" maxlength="10" autocomplete="off">
      <span class="takvim" aria-hidden="true">📅<input type="date" class="takvim-sec" data-hedef="bas" tabindex="-1"></span>
    </div>
  </div>

  <div class="alan" data-a="tarih">
    <label for="tarih" id="tarih_etiket">Hesap tarihi</label>
    <div class="tarih-kutu">
      <input id="tarih" type="text" inputmode="numeric" placeholder="Boş = hesaplama günü" maxlength="10" autocomplete="off">
      <span class="takvim" aria-hidden="true">📅<input type="date" class="takvim-sec" data-hedef="tarih" tabindex="-1"></span>
    </div>
    <div class="not">Boş bırakılırsa hesaplamanın yapıldığı gün kullanılır.</div>
  </div>

  <div class="alan" data-a="ay">
    <label for="ay">Yenileme ayı</label>
    <input id="ay" type="month" placeholder="YYYY-AA (ör. 2026-11)">
  </div>

  <button type="submit" id="gonder">Hesapla</button>
</form>
<div id="onizleme"></div>
<div id="surum" class="not" style="text-align:center;margin-top:24px"></div>

<script>
(function () {
  "use strict";
  var SURUM = "2026-11-22.1";
  var tg = window.Telegram && window.Telegram.WebApp;
  // Klavye düğmesinden açılan Mini App'te initData BOŞ gelir (15.11 canlı hata) ⇒
  // Telegram içinde olmayı birden çok işaretten anla:
  //  • platform (telegram-web-app.js dışarıda "unknown" verir)
  //  • iOS/Android'de Telegram'ın enjekte ettiği köprü (sendData bu köprüden gider)
  //  • masaüstü istemcide window.external.invoke
  var kopru = !!(window.TelegramWebviewProxy ||
                 (window.external && typeof window.external.invoke !== "undefined"));
  var platform = tg && tg.platform ? tg.platform : "yok";
  var telegramda = !!(tg && (kopru || (platform !== "unknown" && platform !== "yok") || tg.initData));
  var TANI = "sürüm " + SURUM + " · platform " + platform + " · köprü " + (kopru ? "var" : "yok") +
             " · tg " + (tg ? "var" : "yok") + " · initData " + (tg && tg.initData ? "dolu" : "boş");
  if (tg) { tg.ready(); tg.expand(); }
  if (telegramda) document.documentElement.setAttribute("data-tg", "1");

  var $ = function (id) { return document.getElementById(id); };

  // --- tarih: elle GG.AA.YYYY (noktalar kendiliğinden) veya 📅 takvimden ---
  // Yalnız rakam yazılıyorsa (iPhone rakam klavyesi) noktalar kendiliğinden konur.
  // Kullanıcı ayraçları kendisi farklı yere koyuyorsa (ör. 1.3.2026, yapıştırma, masaüstü)
  // yazdığına dokunulmaz; yoksa "1.3.2026" → "13.20.26" diye bozulurdu (denetim 16.11).
  function tarihBicimle(el) {
    var ham = el.value.replace(/[^\d.\/-]/g, "").slice(0, 10);
    var rakam = 0, ayrac = 0, kendi = false;
    for (var i = 0; i < ham.length; i++) {
      if (ham[i] >= "0" && ham[i] <= "9") rakam++;
      else { ayrac++; if (ayrac > 2 || rakam !== 2 * ayrac) kendi = true; }
    }
    if (kendi) { el.value = ham; return; }
    var r = ham.replace(/\D/g, "").slice(0, 8);
    el.value = r.length > 4 ? r.slice(0, 2) + "." + r.slice(2, 4) + "." + r.slice(4)
             : r.length > 2 ? r.slice(0, 2) + "." + r.slice(2) : r;
  }
  // "1.3.2026", "01/03/2026", "01032026" → Date (geçersizse null)
  function tarihOku(s) {
    s = (s || "").trim();
    var m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(s) || /^(\d{2})(\d{2})(\d{4})$/.exec(s);
    if (!m) return null;
    var g = +m[1], a = +m[2], y = +m[3], d = new Date(y, a - 1, g);
    if (y < 1900 || y > 2100) return null;             // bot da bu aralığı kabul eder
    return (d.getFullYear() === y && d.getMonth() === a - 1 && d.getDate() === g) ? d : null;
  }
  var iki = function (n) { return (n < 10 ? "0" : "") + n; };
  var ggaayyyy = function (d) { return iki(d.getDate()) + "." + iki(d.getMonth() + 1) + "." + d.getFullYear(); };
  ["bas", "tarih"].forEach(function (id) {
    $(id).addEventListener("input", function () { tarihBicimle($(id)); });
  });
  document.querySelectorAll(".takvim-sec").forEach(function (sec) {
    sec.addEventListener("change", function () {
      if (!sec.value) return;
      var p = sec.value.split("-");                    // YYYY-MM-DD
      $(sec.getAttribute("data-hedef")).value = p[2] + "." + p[1] + "." + p[0];
    });
    // iPhone'da dokununca takvim kendiliğinden açılır; masaüstünde açılması için showPicker
    sec.addEventListener("click", function () {
      if (typeof sec.showPicker === "function") { try { sec.showPicker(); } catch (e) { /* yok say */ } }
    });
  });
  $("tarih").placeholder = "Boş = hesaplama günü (" + ggaayyyy(new Date()) + ")";

  var TUTAR_ETIKET = {
    dosya: "Asıl alacak tutarı (TL)", alacak: "Alacak tutarı (TL)",
    kira: "Mevcut aylık kira (TL)", kiraseyri: "İlk aylık kira (TL)",
    dava: "Dava değeri (TL)", tahliye: "Aylık kira bedeli (TL)",
    tespit: "Aylık kira FARKI (yeni − eski, TL)", icra: "Takip tutarı (TL)",
    icramahkemesi: "İşin değeri (TL)"
  };

  // Hangi hesapta hangi alanlar görünür — bot tarafındaki form.py ile aynı kurallar
  function gerekli() {
    var h = $("hesap").value, f = $("faiz").value;
    var tv = $("tur_vek").value, th = $("tur_harc").value;
    var liste = {
      dosya: ["dosya", "faiz", f === "sozlesme" && "oran", $("dosya").value === "dava" && "mahkeme",
              "tutar", f !== "faizsiz" && "bas", "tarih", $("dosya").value === "dava" && "taraf",
              $("dosya").value === "icra" && "borclu"],
      alacak: ["faiz", f === "sozlesme" && "oran", "tutar", "bas", "tarih"],
      kira: ["tutar", "ay"],
      kiraseyri: ["tur_kira", "tutar", "bas", "tarih"],
      vekalet: ["tur_vek", tv === "dava" && "mahkeme", tv === "icramahkemesi" && "icramah",
                tv === "icra" && "ilam", "tutar", tv !== "icra" && "taraf", tv === "icra" && "borclu"],
      harc: ["tur_harc", th === "dava" && "mahkeme_harc", th === "icra" && "ilam",
             th !== "icramahkemesi" && "tutar"],
      posta: ["tur_posta", "adet", "agirlik", "tarih"]
    }[h];
    return ["hesap"].concat(liste.filter(Boolean));
  }

  // "Faizsiz" yalnız dosya hesabında anlamlıdır. Seçenek, gizlenmek yerine listeden ÇIKARILIR:
  // iPhone'un seçim tekerleği `hidden` işaretli <option>'ı yine de gösterebiliyor.
  var FAIZSIZ = $("faiz").querySelector('option[value="faizsiz"]');

  function guncelle() {
    var h = $("hesap").value, g;
    var listede = FAIZSIZ.parentNode === $("faiz");
    if (h === "dosya" && !listede) $("faiz").appendChild(FAIZSIZ);
    if (h !== "dosya" && listede) {
      if ($("faiz").value === "faizsiz") $("faiz").value = "yasal";
      $("faiz").removeChild(FAIZSIZ);
    }
    g = gerekli();
    document.querySelectorAll(".alan").forEach(function (el) {
      el.hidden = g.indexOf(el.getAttribute("data-a")) < 0;
      el.classList.remove("hatali");
      var e = el.querySelector(".hata-yazi"); if (e) e.remove();
    });
    var anahtar = h === "vekalet" ? $("tur_vek").value : h === "harc" ? $("tur_harc").value : h;
    $("tutar_etiket").textContent = TUTAR_ETIKET[anahtar] || "Tutar (TL)";
    $("bas_etiket").textContent = h === "kiraseyri" ? "Kira başlangıç tarihi" : "Faiz başlangıç (temerrüt) tarihi";
    $("tarih_etiket").textContent = h === "alacak" ? "Faiz bitiş tarihi"
      : h === "kiraseyri" ? "Hangi tarihe kadar"
      : h === "posta" ? "Gönderi tarihi"
      : ($("dosya").value === "icra" ? "Takip tarihi" : "Dava tarihi");
  }

  function hataGoster(alan, mesaj) {
    var el = document.querySelector('.alan[data-a="' + alan + '"]');
    el.classList.add("hatali");
    var d = document.createElement("div"); d.className = "hata-yazi"; d.textContent = mesaj;
    el.appendChild(d);
  }

  var SAYI = /^%?\s*\d{1,3}(\.\d{3})*(,\d+)?\s*%?$|^%?\s*\d+([.,]\d+)?\s*%?$/;
  var GRAM = /^\d{1,3}(\.\d{3})*(,\d+)?$|^\d+([.,]\d+)?$/;
  // Yazılan sayının değeri — botun okuyuşuyla aynı: "100.000" = 100000, "3,5" = 3.5, "0.5" = 0.5
  function sayiDegeri(s) {
    s = s.replace(/[%\s]/g, "");
    if (/^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "");
    return parseFloat(s.replace(",", "."));
  }

  function topla() {
    guncelle();
    var g = gerekli(), v = { v: 1, hesap: $("hesap").value }, tamam = true;
    var ad = { tur_vek: "tur", tur_harc: "tur", tur_kira: "tur", tur_posta: "tur", mahkeme_harc: "mahkeme" };
    g.forEach(function (a) {
      if (a === "hesap") return;
      var deger = ($(a).value || "").trim();
      if ((a === "tutar" || a === "oran") && !SAYI.test(deger)) {
        hataGoster(a, deger ? "Sayı olarak yazın (ör. 100.000)." : "Bu alan boş bırakılamaz.");
        tamam = false; return;
      }
      if (a === "tutar" || a === "oran") {
        var x = sayiDegeri(deger);
        if (!(x > 0)) { hataGoster(a, "Sıfırdan büyük bir sayı yazın."); tamam = false; return; }
        if (a === "oran" && x > 1000) { hataGoster(a, "Oran en fazla %1000 olabilir."); tamam = false; return; }
        if (x > 1e15) { hataGoster(a, "Sayı çok büyük."); tamam = false; return; }
      }
      if ((a === "bas" || a === "ay") && !deger) { hataGoster(a, "Bu alan boş bırakılamaz."); tamam = false; return; }
      if ((a === "bas" || a === "tarih") && deger) {
        var t = tarihOku(deger);
        if (!t) { hataGoster(a, "Tarihi GG.AA.YYYY biçiminde yazın (ör. 01.03.2026)."); tamam = false; return; }
        deger = ggaayyyy(t);
      }
      if (a === "taraf" && !(/^\d{1,3}$/.test(deger) && +deger >= 2 && +deger <= 100)) {
        hataGoster(a, "2 ile 100 arasında bir sayı yazın."); tamam = false; return;
      }
      if (a === "borclu" && !(/^\d{1,3}$/.test(deger) && +deger >= 1 && +deger <= 100)) {
        hataGoster(a, "1 ile 100 arasında bir sayı yazın."); tamam = false; return;
      }
      if (a === "adet" && !(/^\d{1,4}$/.test(deger) && +deger >= 1 && +deger <= 1000)) {
        hataGoster(a, "1 ile 1000 arasında bir sayı yazın."); tamam = false; return;
      }
      // ağırlık: yalnız sayı (gram); birim ve yüzde işareti yazılmaz. Boşsa ilk dilim varsayılır.
      if (a === "agirlik" && deger && !(GRAM.test(deger) && sayiDegeri(deger) > 0)) {
        hataGoster(a, "Gram olarak sıfırdan büyük bir sayı yazın (ör. 250)."); tamam = false; return;
      }
      v[ad[a] || a] = deger;
    });
    if (tamam && v.bas) {
      var bugun = new Date(); bugun.setHours(0, 0, 0, 0);
      var b = tarihOku(v.bas), t = v.tarih ? tarihOku(v.tarih) : bugun;
      var kira = v.hesap === "kiraseyri";            // kira seyrinde başlangıç = hesap günü olabilir
      if (kira ? t < b : t <= b) {
        if (v.tarih) hataGoster("tarih", kira ? "Bu tarih başlangıç tarihinden önce olamaz."
                                              : "Bu tarih başlangıç tarihinden sonra olmalı.");
        else hataGoster("bas", kira ? "Başlangıç tarihi bugünden sonra olamaz (ya da hesap tarihini yazın)."
                                    : "Başlangıç tarihi bugünden önce olmalı (ya da bitiş tarihini yazın).");
        tamam = false;
      }
    }
    return tamam ? v : null;
  }

  function gonder(e) {
    if (e) e.preventDefault();
    var v = topla();
    if (!v) { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); return; }
    var veri = JSON.stringify(v);
    if (telegramda) { tg.sendData(veri); }
    else { $("onizleme").textContent = "Önizleme (Telegram dışında gönderilmez):\n" + veri +
                                       "\n\nTanı: " + TANI; }
  }

  ["hesap", "dosya", "faiz", "tur_vek", "tur_harc"].forEach(function (id) {
    $(id).addEventListener("change", guncelle);
  });
  $("form").addEventListener("submit", gonder);
  if (telegramda) {
    $("gonder").hidden = true;
    tg.MainButton.setText("Hesapla");
    tg.MainButton.show();
    tg.MainButton.onClick(gonder);
  }
  $("surum").textContent = "Form sürümü " + SURUM + (telegramda ? " · Telegram ✓" : " · Telegram dışı");
  var q = new URLSearchParams(location.search).get("h");
  Array.prototype.forEach.call($("hesap").options, function (o) { if (o.value === q) $("hesap").value = q; });
  guncelle();
})();
</script>
</body>
</html>
